moonshine:
    # Namespace where pages and resources live
    namespace: 'App\MoonShine'
    # URL prefix of the admin panel
    prefix: '/admin'
    title: 'MoonShine'
    locale: 'en'
    pages:
        dashboard: 'App\MoonShine\Pages\Dashboard'
        login: 'App\MoonShine\Pages\LoginPage'
    auth:
        # Requires symfony/security-bundle and a configured user provider
        enabled: false
        role: 'ROLE_ADMIN'
        # Register the "moonshine" firewall automatically
        firewall: true
        provider: null
